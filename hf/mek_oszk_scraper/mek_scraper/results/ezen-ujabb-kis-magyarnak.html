<article id="ezen-ujabb-kis-magyarnak"><div class="vers"><h2>(Ezen újabb kis magyarnak…)</h2><p>Ezen újabb kis magyarnak<br>el kellene egy kis gyarmat<br>táján valahol Megyernek,<br>annak örülne e gyermek.<br>(Míg te otthon rajzol,<br>Jolán itten rajzol.)</p><p><small>1933. jan. 12.</small></p></div></article>
