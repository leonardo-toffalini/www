<article id="level"><div class="vers"><h2>[Levél]</h2><p>Nincsen<br>e világon semmi kincsem.</p><p>Rád ám<br>számít a nagybácsi, Ádám.</p><p>Sorsom<br>ezért hozzád visz a gyorson.</p><p>Élve<br>megérkezek péntek délbe.</p><p>Vess el<br>gondot és várj tyúklevessel.</p><p>S felnőtt<br>ha leszel és látsz egy delnőt</p><p>s sorsod<br>orrod alá ha tör borsot,</p><p>add el<br>e lapot s magad ne hadd el.</p></div></article>
