<article id="hallom-hogy-az-adam"><div class="vers"><h2>(Hallom, hogy az Ádám…)</h2><p>Hallom, hogy az Ádám ugy „ül mint a cövek”<br>ugy van odatéve, mint a nehéz kövek<br>és szépen növekszik<br>mert korán lefekszik<br>s megeszi az undok, jó tápfőzeléket<br>ezért mindannyian üdvözölünk téged.</p><p><small>1936. febr. 25.</small></p></div></article>
