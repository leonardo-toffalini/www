<article id="szol-a-telefon"><div class="vers"><h2>(Szól a telefon…)</h2><p>Szól a telefon, fáj a hír,<br>hogy megölted magad, barátom,<br>és konokul fekszel az ágyon.<br>A bolondok között se bírt</p><p>szíved a sorssal. Sehol írt<br>nem leltél arra, hogy ne fájjon<br>a képzelt kín e földi tájon,<br>mely békén nyitja most a sírt.</p><p><small>1937. dec. 3.</small></p></div></article>
