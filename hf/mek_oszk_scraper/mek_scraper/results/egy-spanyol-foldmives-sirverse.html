<article id="egy-spanyol-foldmives-sirverse"><div class="vers"><h2>Egy spanyol földmíves sírvserse</h2><p>Franco tábornok besorolt ádáz katonának,<br><span class="s">nem szöktem meg, mert féltem, agyonlövet úgy.</span><br>Féltem – azért harcoltam a haddal a jog s a szabadság<br><span class="s">ellen Irun falain. S így is elért a halál.</span></p><p><small>1936. aug. vége</small></p></div></article>
