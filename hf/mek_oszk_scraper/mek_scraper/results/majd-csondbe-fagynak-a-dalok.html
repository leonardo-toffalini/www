<article id="majd-csondbe-fagynak-a-dalok"><div class="vers"><h2>(Majd csöndbe fagynak a dalok…)</h2><p>Majd csöndbe fagynak a dalok,<br>a hősiség eloldalog,<br>irgalmat kérnek a balog<br>és kapzsi szenvedélyek.<br>Ugye jobb, hogyha nem csalok?<br>És mert én úgyis meghalok,<br>azt se kivánd, hogy éljek.</p><p><small>1937. jún.</small></p></div></article>
