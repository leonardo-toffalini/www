<article id="dalocska"><div class="vers"><h2>Dalocska</h2><p>Mikor a szeretők veszekednek,<br>akkor hajlongva magasodnak,<br>mikor a szeretők ölelőznek,<br>akkor a földdel elsímulnak.</p><p><span class="s">Énekeljünk –</span><br><span class="s">haja ha!</span><br><span class="s">Bömbölődjünk –</span><br><span class="s">böm-böm-böm!</span><br><span class="s">Susogjunk, hogy</span><br><span class="s">sususu –</span><br><span class="s">üss egyet a</span><br><span class="s">hátamba!</span></p><p><small>1926. márc./1928</small></p></div></article>
