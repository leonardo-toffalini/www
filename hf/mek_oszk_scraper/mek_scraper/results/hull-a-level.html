<article id="hull-a-level"><div class="vers"><h2>(Hull a levél…)</h2><p>Hull a levél a fáról,<br>Elmegyek én e tájról,<br>Elmegyek én messzire,<br>El a világ végire.</p><p>Nékem nincs még szeretőm,<br>Nem adott a Teremtőm.<br>Elmegyek hát keresni,<br>Szeretnék már szeretni.</p><p><small>1922. febr. 13.</small></p></div></article>
