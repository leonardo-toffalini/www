<article id="kedves-joco"><div class="vers"><h2>Kedves Jocó!</h2><h3><small>1. ső strófa</small></h3><p>De szeretnék gazdag lenni,<br>Egyszer libasültet enni,<br>Jó ruhába járni kelni,<br>S öt forintér kuglert venni.</p><h3><small>2. strófa</small></h3><p>Mig a cukrot szopogatnám,<br>Uj ruhámat mutogatnám,<br>Dicsekednél fűnek fának,<br>Mi jó dolga van Attilának.</p><p><small>1916–1917[?]</small></p></div></article>
