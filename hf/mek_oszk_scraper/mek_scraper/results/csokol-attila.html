<article id="csokol-attila"><div class="vers"><h2>(Csókol Attila…)</h2><p>Csókol Attila, a hírneves költő,<br>melyet nem szül kettő,<br>sőt három emberöltő.<br>Attilának tetszik ének, tánc és séta,<br>Ő az édes szavú aranyos poëta,<br>hozzá más költő csak analfabéta.</p><p><small>1921. febr. 20.</small></p></div></article>
