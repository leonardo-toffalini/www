<article id="tedd-a-kezed"><div class="vers"><h2>Tedd a kezed</h2><p>Tedd a kezed <br>homlokomra,<br>mintha kezed<br>kezem volna.</p><p>Úgy őrizz, mint<br>ki gyilkolna,<br>mintha éltem<br>élted volna.</p><p>Úgy szeress, mint<br>ha jó volna,<br>mintha szívem<br>szíved volna.</p><p><small>1928. máj.–jún.</small></p></div></article>
