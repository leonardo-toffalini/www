<article id="sportirodalom"><div class="vers"><h2>Sportirodalom</h2><p>Sportirodalma, Takács, kedvessé tette a sportot<br>méla szememben, amely csak a sakk kockáin öregbült.<br>Már evezőt ragadok, gerelyem zug, röppen a diszkosz.<br>Holnapután kihuzom magamat; – s: milyen egy dali fickó –<br>így sóhajtnak utánam a lányok, még a Takács is.</p><p><small>1937 [?]</small></p></div></article>
