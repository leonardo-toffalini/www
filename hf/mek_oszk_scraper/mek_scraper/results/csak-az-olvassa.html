<article id="csak-az-olvassa"><div class="vers"><h2>(Csak az olvassa…)</h2><p>Csak az olvassa versemet,<br>ki ismer engem és szeret,<br>mivel a semmiben hajóz<br>s hogy mi lesz, tudja, mint a jós,</p><p>mert álmaiban megjelent<br>emberi formában a csend<br>s szivében néha elidőz<br>a tigris meg a szelid őz.</p><p><small>1937. jún. eleje</small></p></div></article>
