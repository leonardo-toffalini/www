<article id="mikor-a-szeretok-valt"><div class="vers"><h2>Mikor a szeretők</h2><p>Mikor a szeretők veszekednek,<br>Akkor a fákkal magosodnak;<br>Mikor a szeretők ölelőznek,<br>Akkor a földdel elsímulnak.</p><p>Gyere kedves,<br>Szaladjunk egyet arccal a szélnek,<br>Hadd pirosodjunk ki, mint a szöllőfürt,<br>Melyet szerelmünknek a tóba dobtam.</p><p><small>Változata a <a href="osszes.html#dalocska">Dalocska</a>.</small></p></div></article>
