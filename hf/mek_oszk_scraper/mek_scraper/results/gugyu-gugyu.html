<article id="gugyu-gugyu"><div class="vers"><h2>Gügyü, gügyü…</h2><p>Gügyü, gügyü Döncike,<br>Nékem is van lányom,<br>Éppen mint te picike,<br>Meglátom a nyáron.<br>Húszesztendő, recece,<br>Asszony lesz a Döncike,<br>Lány marad a lányom,<br>Neki is lesz picike,<br>Éppen mint a Döncike,<br>Dajka lesz a lányom,<br>Gügyü most még picike,<br>Megfujtom a nyáron.</p><p><small>1925 nyara</small></p></div></article>
