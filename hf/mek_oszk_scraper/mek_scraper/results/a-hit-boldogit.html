<article id="a-hit-boldogit"><div class="vers"><h2>A hit boldogít</h2><p>Belép a szép nő páholyába,<br>Csupa arany, fény, ragyogás,<br>Mosolygva bókol erre, arra –<br>A jobb körökben így szokás.</p><p>És a mosoly egy sugarkája<br>A karzatig föl érkezik,<br>És egy diák ott elfelejti,<br>Hogy rongyos és hogy éhezik.</p><p><small>1921 [?]</small></p></div></article>
