<article id="axioma"><div class="vers"><h2>Axióma</h2><p><span class="s">Ha kétszer annyit ennél,</span><br>mint amennyit nem ennél<br>ha éhes volnál, akkor jól<br><span class="s">volnál lakva.</span><br><span class="s">chateaustresemann</span><br><span class="s">avagy </span><br><span class="s">Burgbriand</span><br><span class="s">étekfogó</span></p><p>Maxima: Il y a des hommes qui ont des neveus<br><span class="sorbe-axioma">et des nièces et pantallon noire, et</span><br><span class="sorbe-axioma">des autres.</span></p><p><small>1928. szept. 30.</small></p></div></article>
