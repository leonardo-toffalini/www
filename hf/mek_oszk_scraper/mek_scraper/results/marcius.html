<article id="marcius"><div class="vers"><h2>Március</h2><p>A föld alól a gyors csirák,<br>kidugják fejüket,<br>a fák, mint boltos áruját,<br>kirakják a rügyet,<br>kamaszok arcán pattanás,<br>férfiajkon a csók,<br>mind egy repeső kapkodás,<br>a szoknyák lobogók,<br>s már itt és ott fölhangzanak,<br>elűzve kínt, fagyot,<br>a szívbe húzódott szavak,<br>eszmék és kardalok.</p><p><small>1935 vége</small></p></div></article>
