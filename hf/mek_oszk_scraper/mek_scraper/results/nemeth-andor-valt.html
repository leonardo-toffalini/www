<article id="nemeth-andor-valt"><div class="vers"><h2>németh andor</h2><p>egy nagyon tiszta vizcseppet<br>dörgöljetek a szemire –<br>36 éve várja már<br>térden a kékpupu teve</p><p>ne hagyjátok el asszonyok<br>mert zöld füstben a vizre száll –<br>két fürtje gyöngyházas gyerek-<br>késére gondol vissza már.</p><p><small>A <a href="osszes.html#nemeth-andor">Két vázlat – Németh Andor</a> változata.</small></p></div></article>
