<article id="en-nem-tudom"><div class="vers"><h2>Én nem tudom…</h2><p>Én nem tudom, mi fenyeget<br>az estek csipkés árnyain;<br>mint romló halról a legyek,<br>szétszállnak tőle álmaim.</p><p>És nem tudom, mily dajkahang<br>cseng a szivembe csendesen:<br>nyugodj, hiszen csak este van<br>s mitől is félnél, kedvesem?</p><p><small>1937. jún. eleje</small></p></div></article>
