<article id="anya"><div class="vers"><h2>Anya</h2><p>Az őszi eső szürke kontya<br>arcomba lóg zilálva, bontva.<br>Harmadik napja sírja, mondja,<br>mint tébolyult anya motyogja<br>– mert csecsre vágyom – rám meredve:<br>Reátaláltam gyermekemre,<br>aludj el, édes kedvesem, te,<br>csitt, csitt, kicsikém, tente, tente…</p><p><small>1934. szept. eleje</small></p></div></article>
