<article id="nagy-lajosnak"><div class="vers"><h2>[Nagy Lajosnak]</h2><p>Lajos, ha szépség köll, tömény,<br>azért vagyok itt, költöm én<br>és így lesz szép e költömény.</p><hr id="zoologus-ha"><p>Zoológus ha sürög-forog,<br>megtudhatja: vannak farok,<br>amelyeken nem nő farok.</p><p><small>1932. jún.</small></p></div></article>
