<article id="kultura"><div class="vers"><h2>Kultúra</h2><p>A virág elfáradt már szagosodni.<br>Unta,<br>hogy mifenének tettük asztalunkra.<br>S igyekezett árnyékot vetni,<br>nagyobbat, mint a kertben<br>s elfáradt, mikor nem néztünk oda.</p><p>De észrevettem.</p><p><small>1926 ősze [?]</small></p></div></article>
