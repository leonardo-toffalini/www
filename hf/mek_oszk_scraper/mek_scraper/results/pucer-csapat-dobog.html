<article id="pucer-csapat-dobog"><div class="vers"><h2>(Pucér csapat dobog…)</h2><p>Pucér csapat dobog a dombon,<br>Keresztülgázol kertemen.<br>Belénevetnek kutamba,<br>Hogy kékje nyugtalan legyen.</p><p>Szépek, erősek, egymás húsát<br>Jóltépett lombokkal verdesik –<br>Ugrándozzatok csak magosra<br>S a friss széllel<br>Gyertek el ujra kertemig.</p><p><small>1926. ápr.</small></p></div></article>
