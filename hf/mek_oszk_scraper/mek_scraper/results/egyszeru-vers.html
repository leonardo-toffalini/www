<article id="egyszeru-vers"><div class="vers"><h2>Egyszerű vers</h2><p>Mikor már minden sötét és felszakad köröttünk lilán az ég, akkor<br><span class="s">szeretném látni a szemedet.</span><br>Mikor látlak, csak a szemedet nézem és szeretném megcsókolni<br><span class="s">kezedet merészen.</span><br>Szeretném megcsókolni s mikor ott vagyok Melletted, tudom, hogy<br><span class="s">nem fogom megcsókolni a kezedet.</span></p><p><small>1922 első fele</small></p></div></article>
