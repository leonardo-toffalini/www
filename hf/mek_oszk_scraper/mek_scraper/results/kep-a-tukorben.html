<article id="kep-a-tukorben"><div class="vers"><h2>Kép a tükörben</h2><p>Hogyan volt, azt már nem tudom.<br>De mégis csak megláttam egyszer,<br>Bámultam rája nagy szemekkel.<br>Már régen volt, csak ezt tudom.</p><p>Néztem égve.<br>Arca, alakja tűztükörbe,<br>Szemembe rögződött örökre<br>S szivemre hajlott tündökölve.</p><p>Már régen volt. Nem is tudom.</p><p><small>1922. aug.–szept.</small></p></div></article>
