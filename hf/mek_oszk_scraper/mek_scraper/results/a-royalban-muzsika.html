<article id="a-royalban-muzsika"><div class="vers"><h2>(A Royalban muzsika…)</h2><p>A Royalban muzsika<br>jó kislány a Zsuzsika,<br>kis gyerek a Péterke,<br>kell neki sok ételke,</p><p>a harmadik az Aba,<br>az lesz ám a szép baba.<br>Egyedetek, begyedetek,<br>sok spenótot beegyetek.</p></div></article>
