<article id="wolke" lang="de"><div class="vers"><h2>Wolke</h2><p>Dur wirst nicht meine Frau sein,<br>du wirst leicht sein wie eine Wolke.<br>Ich schliesse mich ins Feld herein,<br>dass ich dich da erwarten sollte.</p><p>Du wirst herkommen in mein Haus,<br>in mein sehr kühles ohne Dach dann:<br>Ich werde traurig, wie die Maus,<br>auf die es regnet, leise, langsam.</p><p lang="hu"><small>1928 vége</small></p></div></article>
