<article id="ady-endre-helyett-mondom"><div class="vers"><h2>Ady Endre helyett mondom</h2><p>A sírás nekem nem kenyerem.<br>Az Úr megverte kushadt fajtám –<br>Most nekilátok s én verem.</p><p>Talán az Ima sáppad ajkán,<br>Ha az Üvöltés ott terem.</p><p>S ha föl nem üvölt hulla-fajtám,<br>Addig verem, mig szétverem.</p><p><small>1923. febr. 17.</small></p></div></article>
