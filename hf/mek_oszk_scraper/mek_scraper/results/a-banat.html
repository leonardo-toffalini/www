<article id="a-banat"><div class="vers"><h2>A bánat</h2><p>A bánat szürke, néma postás,<br>Sovány az arca, szeme kék,<br>Keskeny válláról táska lóg le,<br>Köntöse ócska, meg setét.</p><p>Mellében olcsó tik-tak lüktet,<br>Az utcán félénken suhan,<br>Odasimúl a házfalakhoz<br>És eltünik a kapuban.</p><p>Aztán kopogtat. Levelet hoz.</p><p><small>1922. aug.–szept.</small></p></div></article>
