<article id="du-feu" lang="fr"><div class="vers"><h2>(Du feu…)</h2><p>Du feu en oranges<br>toi la langue inconnue des anges<br>mon amie ne me laisse pas<br>continuer cette baisse-lù dans mes reves<br>des dieux<br>maintenant aussi<br>du goût des oranges sur mes lèvres<br>sans sens et sans souci.</p><p><small>1926</small></p></div></article>
