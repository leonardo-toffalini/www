<article id="bevezeto"><div class="vers"><h2>Bevezető</h2><p>Lidi nénémnek öccse itt,<br>Batu khán pesti rokona,<br>kenyéren élte éveit<br>s nem volt azúrkék paplana;<br>kinek verséért a halál<br>öles kondérban főz babot –<br>hejh burzsoá! hejh proletár! –<br>én, József Attila, itt vagyok!</p><p><small>1927. máj.</small></p></div></article>
