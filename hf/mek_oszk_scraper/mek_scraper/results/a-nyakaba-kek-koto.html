<article id="a-nyakaba-kek-koto"><div class="vers"><h2>(A nyakába kék kötő…)</h2><p>A nyakába kék kötő –<br>mit kötsz, mit kötsz, könyvkötő?</p><p>Kötök, kötök, Bibliát,<br>Bakunint és Pék Gyulát.</p><p>Ej, de bütykös a kezed –<br>mit mond Bakunin neked?</p><p>Bütyök van a kezemen,<br>gyémánt van a szivemen.</p><p><small>1928. szept. 20.</small></p></div></article>
