<article id="lagy-tajek-valt"><div class="vers"><h2>(Lágy tájék…)</h2><p>Lágy tájék, csendes est,<br>tömött, fonott falomb,<br>ködös hegy búja rezg<br>a gyenge halmokon.</p><p>A völgy aranypiros.<br>A málnatő meleg<br>karján buggyos, zsiros<br>papiros szendereg.</p><p><small>Változata a <a href="osszes.html#harmatocska">Harmatocska</a>.</small></p></div></article>
